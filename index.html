<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>

<!-- Google Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f2f2f2;
        margin: 0;
    }

    .card {
        width: 330px;
        background: #ffffff;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        text-align: center;
    }

    .card h2 {
        margin: 0;
        font-size: 24px;
        color: #222;
        font-weight: bold;
    }

    .job-title {
        color: #666;
        margin-top: 5px;
        font-size: 16px;
        font-weight: 500;
    }

    .profile-pic {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        overflow: hidden;
        margin: 15px auto;
        border: 4px solid #ddd;
    }

    .profile-pic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .description {
        font-size: 14px;
        color: #555;
        padding: 0 10px;
        margin-bottom: 15px;
    }

    .links {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 15px;
    }

    .links a {
        text-decoration: none;
        color: #333;
        font-size: 28px;
    }

    .extra-btn {
        background: #4a90e2;
        color: white;
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 14px;
        text-decoration: none;
        display: inline-block;
        transition: 0.3s;
    }

    .extra-btn:hover {
        background: #357ABD;
    }
</style>
</head>
<body>

<div class="card">
    <h2>Sonali Gupta</h2>

    <!-- Job Title Added -->
    <p class="job-title">Frontend Developer</p>

    <div class="profile-pic">
        <img src="https://i.pinimg.com/736x/6c/0e/dc/6c0edc8d0bb5ef76e765928f5c3ac9b9.jpg" alt="Profile Picture">
    </div>

    <p class="description">
        Passionate frontend developer skilled in HTML, CSS, JavaScript, and modern UI design.
    </p>

    <div class="links">
        <a href="https://github.com/Sonali1036" target="_blank">
            <span class="material-icons">code</span>
        </a>
        <a href="https://linkedin.com" target="_blank">
            <span class="material-icons">person</span>
        </a>
    </div>

    <a href="#" class="extra-btn">View Portfolio</a>
</div>

</body>
</html>
